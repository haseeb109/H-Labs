<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:"Mont";font-weight:700;src:url("fonts/montserrat-latin-700-normal.woff2") format("woff2");}
  @font-face{font-family:"Mont";font-weight:800;src:url("fonts/montserrat-latin-800-normal.woff2") format("woff2");}
  @font-face{font-family:"Arch";font-weight:800;src:url("fonts/archivo-latin-800-normal.woff2") format("woff2");}
  @font-face{font-family:"Arch";font-weight:900;src:url("fonts/archivo-latin-900-normal.woff2") format("woff2");}
  html,body{margin:0;padding:0;background:transparent;width:1920px;height:1080px;overflow:hidden;}
  #root{position:relative;width:1920px;height:1080px;background:transparent;}
  .bar{position:absolute;}
  .box{position:absolute;background:#fff;color:#0b0b0b;white-space:nowrap;display:flex;align-items:center;}
  .lime{position:absolute;color:#d9f21c;white-space:nowrap;font-family:"Mont";font-weight:700;}
  #lbl_bar{left:54px;top:99px;width:36px;height:132px;background:#e2761b;}
  #lbl_box{left:108px;top:99px;height:132px;padding:0 30px;font:800 74px/1 "Mont";}
  #hl_bar{left:54px;top:855px;width:36px;height:123px;background:#e2761b;}
  #hl_box{left:108px;top:855px;height:123px;padding:0 30px;font:900 84px/1 "Arch";letter-spacing:-0.5px;}
  #nth_bar{left:549px;top:57px;width:48px;height:150px;background:#b3202a;}
  #nth_box{left:597px;top:57px;height:150px;padding:0 36px;font:800 100px/1 "Mont";}
  #cs{left:375px;top:62px;font-size:128px;line-height:1;letter-spacing:1px;}
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="__DUR__">
  __BODY__
</div>
<script src="gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  const D = __DUR__;
  const els = __ELS__;            // ids to animate
  els.forEach((id, i) => {
    const el = document.getElementById(id);
    if (!el) return;
    tl.fromTo(el, { x: -90, opacity: 0 }, { x: 0, opacity: 1, duration: 0.32, ease: "power3.out" }, 0.05 + i * 0.05);
    tl.to(el, { opacity: 0, duration: 0.3 }, Math.max(0.4, D - 0.32));
  });
  window.__timelines = window.__timelines || {};
  window.__timelines["root"] = tl;
  // shrink a too-wide headline so it always stays on screen
  const hb = document.getElementById("hl_box");
  if (hb) { let fs = 84; while (hb.getBoundingClientRect().right > 1860 && fs > 40) { fs -= 2; hb.style.fontSize = fs + "px"; } }
</script>
</body>
</html>
