<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H Labs Studio</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Main">
    <div class="brand"><div class="logo">HL</div><div><b>H Labs Studio</b><small>Built by M.Haseeb</small></div></div>
    <a class="navlink" data-view="queue" href="#queue">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Queue<span class="count" id="navcount" hidden></span></a>
    <a class="navlink" data-view="new" href="#new">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New run</a>
    <a class="navlink" data-view="library" href="#library">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>Library</a>
    <a class="navlink" data-view="download" href="#download">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Download</a>
    <a class="navlink" data-view="settings" href="#settings">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg>Settings</a>
    <div class="machinebox" id="machinebox"><b>This PC</b><span>checking...</span></div>
  </nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
